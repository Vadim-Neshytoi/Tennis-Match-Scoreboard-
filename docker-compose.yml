services:
  app:
    build: .
    container_name: tennis-match-scoreboard
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: mysql+pymysql://tennis_user:${MYSQL_PASSWORD}@db:3306/tennis_match_scoreboard
      STATIC_ROOT: /app/static
      TEMPLATE_DIR: /app/templates
      HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: tennis-match-scoreboard-db
    environment:
      MYSQL_DATABASE: tennis_match_scoreboard
      MYSQL_USER: tennis_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data: